<style>
:root {
  --cream:#faf8f3; --paper:#f2ede3; --linen:#e8e0d0; --rule:#d5ccb8;
  --ash:#8a8070; --ink:#1c1814; --deep:#0f0d0a;
  --ochre:#b8892a; --ochre-lt:#d4a84b; --terra:#7a3e1a;
  --forest:#2a3d2e; --slate:#3a4a5c;
  --serif:'Playfair Display',Georgia,serif;
  --body:'Source Serif 4',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
a{text-decoration:none;color:inherit;}

/* ── MASTHEAD ── */
.masthead{background:var(--ink);padding:0 2rem;border-bottom:1px solid rgba(255,255,255,0.06);}
.masthead-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:48px;}
.logo{font-family:var(--serif);font-size:1.2rem;font-weight:900;color:var(--cream);letter-spacing:-0.01em;}
.logo span{color:var(--ochre);font-style:italic;}
.nav-links{display:flex;gap:1.5rem;}
.nav-link{font-family:var(--sans);font-size:0.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);transition:color .2s;}
.nav-link:hover{color:var(--cream);}

/* ── SITE HERO ── */
.site-hero{background:var(--deep);padding:2.5rem 2rem 0;border-bottom:1px solid rgba(255,255,255,.06);}
.site-hero-inner{max-width:1280px;margin:0 auto;}
.site-breadcrumb{font-family:var(--sans);font-size:.62rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin-bottom:.8rem;}
.site-breadcrumb a{color:var(--ochre);}
.site-breadcrumb span{margin:0 .4rem;opacity:.3;}
.site-name{font-family:var(--serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:900;color:var(--cream);line-height:1.1;letter-spacing:-.02em;margin-bottom:.5rem;}
.site-meta-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.site-badge{font-family:var(--sans);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .6rem;border-radius:2px;}
.badge-culture{background:rgba(184,137,42,.2);color:var(--ochre);}
.badge-region{background:rgba(42,61,46,.4);color:#7ab890;}
.badge-period{background:rgba(255,255,255,.06);color:var(--ash);}
.site-stats-row{display:flex;gap:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.06);}
.site-stat{text-align:center;}
.site-stat-num{font-family:var(--serif);font-size:1.6rem;font-weight:900;color:var(--ochre);display:block;line-height:1;}
.site-stat-label{font-family:var(--sans);font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ash);margin-top:.2rem;}

/* ── TABS ── */
.site-tabs{background:var(--deep);border-bottom:1px solid rgba(255,255,255,.06);padding:0 2rem;}
.tabs-inner{max-width:1280px;margin:0 auto;display:flex;gap:0;overflow-x:auto;}
.tab-btn{font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.8rem 1.2rem;border:none;background:none;color:var(--ash);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;}
.tab-btn:hover{color:var(--cream);}
.tab-btn.active{color:var(--ochre);border-bottom-color:var(--ochre);}

/* ── MAIN LAYOUT ── */
.site-body{max-width:1280px;margin:0 auto;padding:2.5rem 2rem 4rem;display:grid;grid-template-columns:1fr 360px;gap:3rem;align-items:start;}
@media(max-width:900px){.site-body{grid-template-columns:1fr;}}

/* ── TAB PANELS ── */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── 3D VIEWPORT ── */
.scene-wrap{background:var(--deep);border:1px solid rgba(255,255,255,.08);margin-bottom:2rem;position:relative;border-radius:3px;overflow:hidden;}
.scene-canvas{width:100%;height:420px;display:block;}
.scene-controls{position:absolute;bottom:.8rem;right:.8rem;display:flex;gap:.4rem;}
.scene-btn{background:rgba(15,13,10,.8);border:1px solid rgba(255,255,255,.12);color:var(--ash);font-family:var(--sans);font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .7rem;cursor:pointer;border-radius:2px;transition:all .2s;backdrop-filter:blur(4px);}
.scene-btn:hover{color:var(--cream);border-color:rgba(255,255,255,.3);}
.scene-label{position:absolute;top:.8rem;left:.8rem;background:rgba(15,13,10,.8);border:1px solid rgba(184,137,42,.3);color:var(--ochre);font-family:var(--sans);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.25rem .6rem;border-radius:2px;backdrop-filter:blur(4px);}
.scene-attribution{position:absolute;bottom:.8rem;left:.8rem;font-family:var(--sans);font-size:.55rem;color:rgba(138,128,112,.6);}

/* ── SYNTHESIS CONTENT ── */
.synthesis-content{font-size:.95rem;line-height:1.75;color:#3a3028;}
.synthesis-content h3{font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--ink);margin:1.5rem 0 .5rem;}
.synthesis-content p{margin-bottom:1rem;}
.synthesis-content ul{margin:.5rem 0 1rem 1.5rem;}
.synthesis-content li{margin-bottom:.3rem;}
.ai-badge{display:inline-flex;align-items:center;gap:.35rem;background:rgba(184,137,42,.1);color:var(--ochre);font-family:var(--sans);font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:2px;margin-bottom:1rem;}
.confidence-bar{height:2px;background:var(--linen);border-radius:1px;margin-bottom:1.5rem;}
.confidence-fill{height:100%;background:var(--ochre);border-radius:1px;transition:width .5s ease;}
.placeholder-text{color:var(--ash);font-style:italic;font-size:.9rem;line-height:1.6;}

/* ── PAPERS FEED ── */
.papers-list{display:flex;flex-direction:column;gap:0;}
.paper-item{padding:1.2rem 0;border-bottom:1px solid var(--linen);}
.paper-item:last-child{border-bottom:none;}
.paper-tag{font-family:var(--sans);font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);margin-bottom:.25rem;}
.paper-title{font-family:var(--serif);font-size:.95rem;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:.3rem;}
.paper-title a:hover{color:var(--ochre);}
.paper-summary{font-size:.8rem;color:var(--ash);line-height:1.5;margin-bottom:.4rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.paper-meta{font-family:var(--sans);font-size:.62rem;color:var(--ash);display:flex;gap:.5rem;flex-wrap:wrap;}
.paper-meta strong{color:var(--ink);}

/* ── SIDEBAR ── */
.site-sidebar{position:sticky;top:1.5rem;}
.sidebar-card{background:white;border:1px solid var(--rule);padding:1.2rem 1.3rem;margin-bottom:1.2rem;}
.sidebar-label{font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ochre);margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule);}
.info-row{display:flex;justify-content:space-between;align-items:baseline;padding:.3rem 0;border-bottom:1px dotted var(--linen);}
.info-row:last-child{border-bottom:none;}
.info-key{font-family:var(--sans);font-size:.65rem;color:var(--ash);}
.info-val{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--ink);text-align:right;max-width:60%;}
.ext-link{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;border-bottom:1px dotted var(--linen);font-family:var(--sans);font-size:.72rem;color:var(--ash);transition:color .2s;cursor:pointer;}
.ext-link:last-child{border-bottom:none;}
.ext-link:hover{color:var(--ochre);}
.ext-link-arrow{font-size:.7rem;opacity:.5;}

/* ── TOPOSTEXT BLOCK ── */
.topos-block{background:var(--forest);padding:1rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;}
.topos-num{font-family:var(--serif);font-size:2rem;font-weight:900;color:var(--ochre);line-height:1;}
.topos-lbl{font-family:var(--sans);font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(232,224,208,.6);line-height:1.4;}
.topos-btn{font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);border:1px solid rgba(184,137,42,.4);padding:.35rem .8rem;white-space:nowrap;transition:all .2s;}
.topos-btn:hover{background:rgba(184,137,42,.15);}

/* ── NATIVE LAND ── */
.nl-card { background:white; border:1px solid var(--rule); padding:1.2rem 1.3rem; margin-bottom:1.2rem; }
.nl-loading { display:flex; align-items:center; gap:.5rem; font-family:var(--sans); font-size:.7rem; color:var(--ash); }
.nl-loading-dot { width:5px; height:5px; border-radius:50%; background:var(--ochre); animation:ldot 1.2s ease infinite; }
.nl-loading-dot:nth-child(2){animation-delay:.2s;} .nl-loading-dot:nth-child(3){animation-delay:.4s;}
.nl-group { margin-bottom:.85rem; }
.nl-group:last-of-type { margin-bottom:.5rem; }
.nl-group-label { font-family:var(--sans); font-size:.52rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ash); margin-bottom:.4rem; }
.nl-pills { display:flex; flex-wrap:wrap; gap:.35rem; }
.nl-pill { font-family:var(--sans); font-size:.65rem; font-weight:600; padding:.25rem .6rem; border-radius:2px; cursor:pointer; transition:opacity .15s; text-decoration:none; display:inline-block; }
.nl-pill:hover { opacity:.75; }
.nl-pill-territory { background:rgba(122,62,26,.12); color:var(--terra); border:1px solid rgba(122,62,26,.2); }
.nl-pill-language  { background:rgba(42,61,46,.12);  color:#2a5c38;   border:1px solid rgba(42,61,46,.2); }
.nl-pill-treaty    { background:rgba(58,74,92,.12);  color:var(--slate); border:1px solid rgba(58,74,92,.2); }
.nl-none { font-family:var(--sans); font-size:.7rem; color:var(--ash); font-style:italic; }
.nl-disclaimer { font-family:var(--sans); font-size:.58rem; color:var(--ash); line-height:1.45; margin-top:.7rem; padding-top:.6rem; border-top:1px dotted var(--linen); opacity:.75; }
.nl-disclaimer a { color:var(--ochre); }
.nl-map-link { display:flex; align-items:center; justify-content:space-between; padding:.35rem 0 0; font-family:var(--sans); font-size:.68rem; color:var(--ash); transition:color .2s; }
.nl-map-link:hover { color:var(--ochre); }

/* ── SKETCHFAB ATTRIBUTION ── */
.sketchfab-attr{
  position:absolute;bottom:.8rem;left:.8rem;
  background:rgba(15,13,10,.75);
  border:1px solid rgba(184,137,42,.2);
  color:var(--ash);font-family:var(--sans);font-size:.55rem;
  letter-spacing:.04em;padding:.22rem .55rem;border-radius:2px;
  backdrop-filter:blur(4px);
}
.sketchfab-attr a{color:var(--ochre-lt);text-decoration:none;}
.sketchfab-attr a:hover{text-decoration:underline;}

/* ── LOADING ── */
.loading-state{padding:3rem 0;text-align:center;}
.loading-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ochre);margin:0 2px;animation:ldot 1.2s ease infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes ldot{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ── FOOTER ── */
.footer{background:var(--ink);color:var(--ash);text-align:center;padding:1.5rem;font-family:var(--sans);font-size:.68rem;}
.footer a{color:var(--ochre);}
</style>

<script>
// ── CONFIG ────────────────────────────────────────────────
const SUPABASE_URL      = "https://ucsgtbpeuqeamuvuvojs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjc2d0YnBldXFlYW11dnV2b2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzI1ODgsImV4cCI6MjA4OTU0ODU4OH0.X6xIwg0CD6jPY8OQBCL6PejepmUeztUZQwolrfCmHXA";

// ── HTML entity decoder ───────────────────────────────────
// Converts any HTML entities stored in DB values (e.g. &#250; → ú,
// &amp; → &, &eacute; → é) into proper Unicode before display.
// Use hn(value) everywhere a site field is rendered as text.
const _decodeEl = document.createElement('textarea');
function hn(str) {
  if (!str) return str;
  _decodeEl.innerHTML = str;
  return _decodeEl.value;
}

// ── Get site ID from URL ──────────────────────────────────
function getSiteId() {
  const params = new URLSearchParams(window.location.search);
  const path   = window.location.pathname;
  // Support /site.html?id=tikal and /site/tikal
  return params.get("id") ||
         path.split("/").filter(Boolean).pop()?.replace(".html","") ||
         "tikal";
}

const siteId = getSiteId();

// ── Supabase fetch helper ─────────────────────────────────
async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey":        SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${path}`);
  return res.json();
}

// ── Helpers ───────────────────────────────────────────────
function regionLabel(r) {
  return {mesoamerica:"Mesoamerica",north_america:"North America",
          europe:"Europe",near_east:"Near East",general:"General"}[r] ?? r ?? "";
}
function relDate(iso) {
  if (!iso) return "";
  const diff = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (diff < 1)  return "Today";
  if (diff < 7)  return Math.floor(diff)+"d ago";
  if (diff < 60) return Math.floor(diff/7)+"w ago";
  return new Date(iso).toLocaleDateString("en-US",{month:"short",year:"numeric"});
}
function renderMarkdown(md) {
  if (!md) return "";
  return md
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm,  "<h3>$1</h3>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,     "<em>$1</em>")
    .replace(/^- (.+)$/gm,    "<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`)
    .replace(/\n\n/g, "</p><p>")
    .replace(/^(?!<[hul])/gm, "<p>")
    .replace(/(?<![>])$/gm, "</p>")
    .replace(/<p><\/p>/g, "");
}

// ── Load site data ────────────────────────────────────────
async function loadSite() {
  // Find site by name (slug) or UUID
  const isUuid = /^[0-9a-f-]{36}$/i.test(siteId);
  const filter = isUuid
    ? `id=eq.${siteId}`
    : `name=ilike.${encodeURIComponent(siteId)}&limit=1`;

  const sites = await sb(`archaeology_sites?${filter}&select=*`);
  if (!sites.length) {
    document.getElementById("siteName").textContent = "Site not found";
    return;
  }
  const site = sites[0];

  // Update page title and breadcrumb
  document.title = `${hn(site.name)} — archAIology`;
  document.getElementById("pageTitle").textContent = `${hn(site.name)} — archAIology`;
  document.getElementById("bcRegion").textContent = regionLabel(site.region);
  document.getElementById("bcName").textContent   = hn(site.name);
  document.getElementById("siteName").textContent = hn(site.name);

  // Badges
  const badges = [
    site.culture ? `<span class="site-badge badge-culture">${hn(site.culture)}</span>` : "",
    site.region  ? `<span class="site-badge badge-region">${regionLabel(site.region)}</span>` : "",
    site.period  ? `<span class="site-badge badge-period">${hn(site.period)}</span>` : "",
    site.country ? `<span class="site-badge badge-period">${hn(site.country)}</span>` : "",
  ].filter(Boolean).join("");
  document.getElementById("siteMeta").innerHTML = badges;

  // Stats (will update with real counts below)
  renderStats(site, 0, 0);

  // Sidebar record
  renderRecord(site);

  // External links
  renderExtLinks(site);

  // ToposText block
  if (site.ancient_refs > 0 && site.topostext_url) {
    document.getElementById("toposBlock").style.display = "block";
    document.getElementById("toposNum").textContent = site.ancient_refs.toLocaleString();
    document.getElementById("toposBtn").href = site.topostext_url;
  }

  // Load corpus mentions (news/RSS) AND uploaded PDFs in parallel
  const [corpus, pdfLinks] = await Promise.all([
    sb(`archaeology_corpus?site_id=eq.${site.id}&select=title,source_url,content_type,published_at,source,author,summary&order=published_at.desc&limit=20`),
    sb(`pdf_site_links?site_id=eq.${site.id}&select=pdf_id,confidence&limit=50`),
  ]);

  // Resolve PDF records from pdf_corpus
  let pdfPapers = [];
  if (pdfLinks.length) {
    const ids = pdfLinks.map(l => l.pdf_id).join(',');
    const pdfs = await sb(`pdf_corpus?id=in.(${ids})&select=id,title,filename,author,year,journal,doi,summary,uploaded_at,word_count&order=uploaded_at.desc`);
    pdfPapers = pdfs.map(p => ({
      title:        p.title || p.filename,
      source_url:   p.doi ? `https://doi.org/${p.doi}` : null,
      content_type: 'pdf',
      published_at: p.uploaded_at,
      source:       p.journal || 'Uploaded PDF',
      author:       p.author,
      summary:      p.summary,
      year:         p.year,
      word_count:   p.word_count,
      confidence:   pdfLinks.find(l => l.pdf_id === p.id)?.confidence,
    }));
  }

  const allPapers = [...pdfPapers, ...corpus];
  window._allPapers = allPapers; // expose for on-demand synthesis
  renderStats(site, allPapers.length, site.ancient_refs ?? 0);
  renderPapers(allPapers);

  // Load reconstruction
  const recons = await sb(`site_reconstructions?site_id=eq.${site.id}&select=*`);
  initScene(recons[0] ?? null, site);

  // Load synthesis tabs
  const tabs = await sb(`site_synthesis?site_id=eq.${site.id}&select=*`);
  renderSynthesisTabs(tabs, site, allPapers);

  window._currentSite = site;
  if (site.lat && site.lng) loadNativeLand(site.lat, site.lng);
  return site;
}

function renderStats(site, mentionCount, ancientRefs) {
  document.getElementById("siteStats").innerHTML = `
    <div class="site-stat">
      <span class="site-stat-num">${mentionCount}</span>
      <span class="site-stat-label">Modern papers</span>
    </div>
    <div class="site-stat">
      <span class="site-stat-num">${(ancientRefs || 0).toLocaleString()}</span>
      <span class="site-stat-label">Ancient refs</span>
    </div>
    ${site.lat ? `
    <div class="site-stat">
      <span class="site-stat-num">${site.lat.toFixed(2)}°</span>
      <span class="site-stat-label">Latitude</span>
    </div>
    <div class="site-stat">
      <span class="site-stat-num">${site.lng.toFixed(2)}°</span>
      <span class="site-stat-label">Longitude</span>

}

function renderRecord(site) {
  const rows = [
    ["Culture",    hn(site.culture)],
    ["Period",     hn(site.period)],
    ["Region",     regionLabel(site.region)],
    ["Country",    hn(site.country)],
    ["Subregion",  hn(site.subregion)],
  ].filter(r => r[1]);

  document.getElementById("siteRecord").innerHTML = rows.map(([k,v]) => `
    <div class="info-row">
      <span class="info-key">${k}</span>
      <span class="info-val">${v}</span>
    </div>`).join("") +
    (site.description ? `<p style="font-family:var(--body);font-size:.82rem;color:var(--ash);line-height:1.55;margin-top:.8rem">${hn(site.description)}</p>` : "");
}

function renderExtLinks(site) {
  const links = [
    site.wikipedia_url  ? ["Wikipedia",  site.wikipedia_url]  : null,
    site.topostext_url  ? ["ToposText",  site.topostext_url]  : null,
    site.lat && site.lng ? ["Google Maps",
      `https://www.google.com/maps/@${site.lat},${site.lng},14z`] : null,
  ].filter(Boolean);

  document.getElementById("extLinks").innerHTML = links.map(([label, url]) => `
    <a class="ext-link" href="${url}" target="_blank" rel="noopener">
      <span>${label}</span><span class="ext-link-arrow">↗</span>
    </a>`).join("");
}

function renderPapers(papers) {
  const list = document.getElementById("papersList");
  if (!papers.length) {
    list.innerHTML = `<p class="placeholder-text">No papers in corpus yet for this site. Upload PDFs via the <a href="upload.html" style="color:var(--ochre-lt)">Upload portal</a> to populate this section.</p>`;
    return;
  }
  list.innerHTML = papers.map(p => {
    const isPdf = p.content_type === 'pdf';
    const tag = isPdf
      ? `📄 PDF · ${p.source ?? 'Uploaded'}`
      : `📰 ${p.content_type === 'paper' ? 'Paper' : 'News'} · ${p.source ?? ''}`;
    const dateStr = isPdf && p.year
      ? p.year
      : relDate(p.published_at);
    const conf = p.confidence ? ` <span style="opacity:.4;font-size:.6rem">${(p.confidence*100).toFixed(0)}% match</span>` : '';
    const words = p.word_count ? ` · ${p.word_count.toLocaleString()} words` : '';
    return `
    <div class="paper-item">
      <div class="paper-tag">${tag}${words}</div>
      <div class="paper-title">${p.source_url
        ? `<a href="${p.source_url}" target="_blank" rel="noopener">${p.title}</a>`
        : p.title}</div>
      ${p.summary ? `<div class="paper-summary">${p.summary}</div>` : ''}
      <div class="paper-meta">
        ${p.author ? `<strong>${p.author.slice(0,60)}</strong>` : ''}
        <span>${dateStr}${conf}</span>
      </div>
    </div>`;
  }).join('');
}

function renderSynthesisTabs(tabs, site, corpus) {
  const tabNames = ["overview","archaeological","biological","cultural","linguistic"];
  const tabMap   = {};
  tabs.forEach(t => { tabMap[t.tab] = t; });

  // Show button if any papers exist — the Edge Function fetches corpus itself
  const pdfCount  = corpus.filter(p => p.content_type === 'pdf').length;
  const anyPapers = corpus.length > 0;
  const btnLabel  = pdfCount > 0
    ? `✦ Generate from ${pdfCount} PDF${pdfCount > 1 ? 's' : ''}`
    : corpus.length > 0
    ? `✦ Generate synthesis`
    : '';

  tabNames.forEach(tabName => {
    const el  = document.getElementById(`synthesis${tabName.charAt(0).toUpperCase()+tabName.slice(1)}`);
    if (!el) return;
    const syn = tabMap[tabName];

    if (syn?.content) {
      el.innerHTML = `
        <div class="ai-badge">🤖 AI Draft${syn.approved ? " · ✓ Reviewed" : " · Pending review"}</div>
        <div class="confidence-bar">
          <div class="confidence-fill" style="width:${Math.round((syn.confidence??0.7)*100)}%"></div>
        </div>
        <div class="synthesis-content">${renderMarkdown(syn.content)}</div>
      `;
    } else {
      const name = hn(site.name);
      const placeholders = {
        overview:       `Overview synthesis for ${name} will be generated from corpus papers.`,
        archaeological: `Archaeological analysis for ${name} — stratigraphy, material culture, architecture, chronology.`,
        biological:     `Biological anthropology data for ${name} — skeletal analysis, paleopathology, diet, migration.`,
        cultural:       `Cultural analysis for ${name} — ritual practices, social organization, iconography, exchange networks.`,
        linguistic:     `Linguistic data for ${name} — epigraphy, glyphic inscriptions, language affiliations.`,
      };

      const generateBtn = anyPapers
        ? `<button class="synth-generate-btn" onclick="generateSynthesisFromPDFs('${tabName}')">
             ${btnLabel}
           </button>`
        : '';

      el.innerHTML = `
        <p class="placeholder-text">${placeholders[tabName] ?? "Content pending."}</p>
        ${generateBtn}
      `;
    }
  });
}

// ── Generate synthesis via Supabase Edge Function ──────────────
// POSTs {site_id} to synthesize-site — the function calls Claude
// server-side and writes all five tabs to site_synthesis directly.
async function generateSynthesisFromPDFs(_requestedTab) {
  const site = window._currentSite;
  if (!site) return;

  // Show spinner in all empty tab panels
  const tabNames = ["overview","archaeological","biological","cultural","linguistic"];
  tabNames.forEach(t => {
    const el = document.getElementById(`synthesis${t.charAt(0).toUpperCase()+t.slice(1)}`);
    if (el && !el.querySelector('.confidence-fill')) {
      el.innerHTML = `<div class="synth-generating">
        <div class="synth-spinner"></div>
        Generating synthesis — this takes about 30 seconds…
      </div>`;
    }
  });

  try {
    const resp = await fetch(
      'https://ucsgtbpeuqeamuvuvojs.supabase.co/functions/v1/synthesize-site',
      {
        method:  'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey':        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjc2d0YnBldXFlYW11dnV2b2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzI1ODgsImV4cCI6MjA4OTU0ODU4OH0.X6xIwg0CD6jPY8OQBCL6PejepmUeztUZQwolrfCmHXA',
          'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjc2d0YnBldXFlYW11dnV2b2pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NzI1ODgsImV4cCI6MjA4OTU0ODU4OH0.X6xIwg0CD6jPY8OQBCL6PejepmUeztUZQwolrfCmHXA',
        },
        body: JSON.stringify({ site_id: site.id }),
      }
    );

    if (!resp.ok) throw new Error(`Edge Function ${resp.status}: ${await resp.text()}`);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error ?? 'Unknown error');

    // Re-fetch synthesis rows and re-render tabs
    const tabs = await sb(`site_synthesis?site_id=eq.${site.id}&select=*`);
    const allPapers = window._allPapers ?? [];
    renderSynthesisTabs(tabs, site, allPapers);

    console.log('[synthesis] Done:', data);

  } catch (err) {
    console.error('[synthesis] Failed:', err);
    tabNames.forEach(t => {
      const el = document.getElementById(`synthesis${t.charAt(0).toUpperCase()+t.slice(1)}`);
      if (el?.querySelector('.synth-spinner')) {
        el.innerHTML = `<p class="placeholder-text" style="color:var(--terra)">
          Generation failed: ${err.message}
        </p>
        <button class="synth-generate-btn" onclick="generateSynthesisFromPDFs('${t}')">
          ↺ Retry
        </button>`;
      }
    });
  }
}

function initScene(recon, site) {
  const canvas = document.getElementById("sceneCanvas");
  const wrap   = document.getElementById("sceneWrap");

  // ── Check for a curated external view first ─────────────────────────────
  // Use the URL ?id= param as the lookup key (reliable, user-controlled),
  // falling back to site.name for sites matched by UUID.
  const extKey = (
    new URLSearchParams(window.location.search).get('id') ?? site.name ?? ''
  ).toLowerCase().trim();
  const ext = SITE_EXTERNAL_VIEWS[extKey];
  if (ext) {
    // Hide canvas and 3D controls — shared by both iframe and sketchfab paths
    canvas.style.display = 'none';
    document.getElementById('btnRotate').style.display = 'none';
    document.getElementById('btnReset').style.display  = 'none';
    document.getElementById('sceneLabel').textContent  = ext.label;
    document.getElementById('sceneAttr').textContent   = '';

    // ── SKETCHFAB path ────────────────────────────────────────────────────
    if (ext.type === 'sketchfab') {
      // Build embed URL with clean parameters (no ads, no recommendations,
      // dark theme to match platform, autostart so model loads immediately)
      const sfSrc = [
        `https://sketchfab.com/models/${ext.modelId}/embed`,
        `?autostart=1`,
        `&autospin=0`,
        `&ui_theme=dark`,
        `&ui_infos=0`,
        `&ui_watermark=0`,
        `&ui_controls=1`,
        `&ui_annotations=0`,
        `&dnt=1`,           // Sketchfab Do-Not-Track — disables personalised recommendations
      ].join('');

      const sfIframe = document.createElement('iframe');
      sfIframe.src   = sfSrc;
      sfIframe.title = ext.title ?? ext.label;
      sfIframe.setAttribute('frameborder', '0');
      sfIframe.setAttribute('allowfullscreen', '');
      sfIframe.setAttribute('mozallowfullscreen', 'true');
      sfIframe.setAttribute('webkitallowfullscreen', 'true');
      sfIframe.setAttribute('allow', 'autoplay; fullscreen; xr-spatial-tracking');
      sfIframe.style.cssText = 'width:100%;height:420px;border:none;display:block;';

      // Sketchfab attribution — required by their terms; styled to match platform
      const sfAttr = document.createElement('div');
      sfAttr.className = 'sketchfab-attr';
      sfAttr.innerHTML = `
        <a href="https://sketchfab.com/3d-models/${ext.modelId}?utm_medium=embed"
           target="_blank" rel="noopener">${ext.title ?? ext.label}</a>
        by
        <a href="${ext.authorUrl ?? 'https://sketchfab.com'}"
           target="_blank" rel="noopener">${ext.author ?? 'author'}</a>
        on Sketchfab
      `;

      // "Open in Sketchfab" button in controls bar
      const sfBtn = document.createElement('button');
      sfBtn.className   = 'scene-btn';
      sfBtn.textContent = '⬡ View on Sketchfab';
      sfBtn.onclick = () => window.open(
        `https://sketchfab.com/3d-models/${ext.modelId}`, '_blank', 'noopener'
      );
      document.querySelector('.scene-controls').appendChild(sfBtn);

      wrap.insertBefore(sfIframe, canvas);
      wrap.appendChild(sfAttr);
      return; // skip Three.js scene
    }

    // ── IFRAME path (existing behaviour for maps/external sites) ──────────
    const iframeUrl = ext.url;
    document.getElementById('sceneAttr').textContent = ext.credit ?? '';

    const iframe = document.createElement('iframe');
    iframe.src    = iframeUrl;
    iframe.style.cssText = 'width:100%;height:420px;border:none;display:block;';
    iframe.allow  = 'fullscreen';
    iframe.title  = ext.label;

    // Fallback panel shown if X-Frame-Options blocks the embed
    const fallback = document.createElement('div');
    fallback.style.cssText = 'display:none;width:100%;position:relative;';

    if (ext.placeholderImg) {
      // Rich image placeholder
      fallback.innerHTML = `
        <div style="position:relative;width:100%;height:420px;overflow:hidden;background:#0a0806;">
          <img
            src="${ext.placeholderImg}"
            alt="${ext.placeholderAlt ?? ext.label}"
            style="width:100%;height:100%;object-fit:cover;opacity:.72;display:block;"
            onerror="this.parentElement.style.background='#0f0d0a'"
          >
          <!-- Gradient overlay -->
          <div style="position:absolute;inset:0;
            background:linear-gradient(to top,rgba(8,6,4,.92) 0%,rgba(8,6,4,.3) 45%,rgba(8,6,4,.1) 100%);
            pointer-events:none;"></div>
          <!-- Bottom info bar -->
          <div style="position:absolute;bottom:0;left:0;right:0;padding:1.2rem 1.4rem;">
            <div style="font-family:var(--mono);font-size:.52rem;letter-spacing:.16em;
              text-transform:uppercase;color:var(--ochre-lt);margin-bottom:.35rem;opacity:.7;">
              Interactive 3D viewer · Cannot embed · Open in new tab
            </div>
            <div style="font-family:var(--serif);font-size:1.3rem;font-weight:900;
              color:var(--cream);margin-bottom:.5rem;line-height:1.2;">
              ${ext.label}
            </div>
            <div style="display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;">
              <a href="${iframeUrl}" target="_blank" rel="noopener"
                style="font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
                  padding:.38rem .9rem;border:1px solid rgba(184,137,42,.6);
                  color:var(--ochre-lt);text-decoration:none;
                  background:rgba(8,6,4,.5);backdrop-filter:blur(4px);
                  transition:all .2s;"
                onmouseover="this.style.background='rgba(184,137,42,.18)';this.style.borderColor='var(--ochre-lt)'"
                onmouseout="this.style.background='rgba(8,6,4,.5)';this.style.borderColor='rgba(184,137,42,.6)'">
                ↗ Open full interactive map
              </a>
              <span style="font-size:.56rem;color:rgba(242,234,216,.35);">
                retratodetenochtitlan.mx
              </span>
            </div>
          </div>
          <!-- Top-right caption -->
          <div style="position:absolute;top:.7rem;right:.8rem;
            font-size:.52rem;color:rgba(242,234,216,.3);font-family:var(--mono);
            text-align:right;line-height:1.5;max-width:300px;">
            ${ext.placeholderCaption ?? ''}
          </div>
        </div>`;
    } else {
      // Generic fallback (no placeholder image)
      fallback.style.cssText = [
        'display:none;width:100%;height:420px;',
        'background:rgba(15,13,10,.9);',
        'flex-direction:column;align-items:center;justify-content:center;',
        'gap:1rem;text-align:center;padding:2rem;',
      ].join('');
      fallback.innerHTML = `
        <div style="font-size:2rem;opacity:.4">🗺</div>
        <div style="font-family:var(--serif);font-size:1.1rem;color:var(--cream)">${ext.label}</div>
        <div style="font-size:.75rem;color:var(--ash);max-width:340px;line-height:1.6">
          This map cannot be embedded due to the site's security policy.
        </div>
        <a href="${iframeUrl}" target="_blank" rel="noopener"
           style="font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
                  padding:.45rem 1rem;border:1px solid rgba(184,137,42,.5);
                  color:var(--ochre-lt);text-decoration:none;transition:all .2s;"
           onmouseover="this.style.background='rgba(184,137,42,.12)'"
           onmouseout="this.style.background='none'">
          Open full interactive map ↗
        </a>
        <div style="font-size:.58rem;color:rgba(138,128,112,.4)">${ext.credit ?? ''}</div>`;
    }

    // "Open full map" button always visible in controls
    const openBtn = document.createElement('button');
    openBtn.className   = 'scene-btn';
    openBtn.textContent = '↗ Open full map';
    openBtn.onclick     = () => window.open(iframeUrl, '_blank', 'noopener');
    document.querySelector('.scene-controls').appendChild(openBtn);

    iframe.style.display   = 'block';
    fallback.style.display = 'none';

    // Detect X-Frame-Options block after load
    const showFallback = () => {
      iframe.style.display   = 'none';
      fallback.style.display = ext.placeholderImg ? 'block' : 'flex';
    };
    iframe.onload = () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow?.document;
        if (!doc || !doc.body || doc.body.innerHTML === '') showFallback();
      } catch {
        // Cross-origin — means it loaded successfully; leave visible
      }
    };
    iframe.onerror = showFallback;

    wrap.insertBefore(iframe, canvas);
    wrap.appendChild(fallback);
    return; // skip Three.js scene
  }

  sceneThree = new THREE.Scene();
  camera     = new THREE.PerspectiveCamera(55, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
  camera.position.set(18, 12, 18);
  camera.lookAt(0, 3, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  // Lighting
  const ambient = new THREE.AmbientLight(0xfff8e8, 0.6);
  sceneThree.add(ambient);
  const sun = new THREE.DirectionalLight(0xfff0cc, 1.2);
  sun.position.set(20, 30, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sceneThree.add(sun);
  const fill = new THREE.DirectionalLight(0xc8e8ff, 0.3);
  fill.position.set(-15, 10, -10);
  sceneThree.add(fill);

  // Build scene from reconstruction params or defaults
  const sceneParams = recon?.scene_json ?? {
    culture:    (site.culture ?? "maya").toLowerCase(),
    period:     site.period ?? "Classic",
    structures: [],
    scale:      "large",
  };
  sceneParams.culture = sceneParams.culture ?? (site.culture ?? "maya").toLowerCase();

  ArchaiologyEngine.buildScene(THREE, sceneThree, sceneParams);

  // Labels
  document.getElementById("sceneLabel").textContent =
    `${hn(site.name)} — Procedural Reconstruction`;
  document.getElementById("sceneAttr").textContent =
    recon ? `Based on ${recon.source_count ?? 0} corpus papers` :
            "Default model · Refines as corpus grows";

  // Mouse orbit
  let dragging = false, lastX = 0, lastY = 0;
  let theta = Math.PI/4, phi = Math.PI/4, radius = 26;

  function updateCamera() {
    camera.position.set(
      radius * Math.sin(phi) * Math.sin(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(0, 3, 0);
  }

  canvas.addEventListener("mousedown", e => { dragging = true; lastX=e.clientX; lastY=e.clientY; autoRotate=false; });
  window.addEventListener("mouseup",   () => { dragging = false; });
  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    theta += (e.clientX - lastX) * 0.008;
    phi    = Math.max(0.2, Math.min(Math.PI/2, phi + (e.clientY - lastY) * 0.005));
    lastX  = e.clientX; lastY = e.clientY;
    updateCamera();
  });
  canvas.addEventListener("wheel", e => {
    radius = Math.max(10, Math.min(50, radius + e.deltaY * 0.04));
    updateCamera();
  });

  // Touch support
  let lastTouchX = 0;
  canvas.addEventListener("touchstart", e => { lastTouchX = e.touches[0].clientX; autoRotate=false; });
  canvas.addEventListener("touchmove",  e => {
    theta += (e.touches[0].clientX - lastTouchX) * 0.01;
    lastTouchX = e.touches[0].clientX;
    updateCamera();
  });

  // Buttons
  document.getElementById("btnRotate").addEventListener("click", function() {
    autoRotate = !autoRotate;
    this.textContent = autoRotate ? "⟳ Auto-rotate" : "⏸ Paused";
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    theta = Math.PI/4; phi = Math.PI/4; radius = 26;
    autoRotate = true;
    updateCamera();
  });

  // Resize
  window.addEventListener("resize", () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Render loop
  function animate() {
    if (!animating) return;
    requestAnimationFrame(animate);
    if (autoRotate) { theta += ORBIT_SPEED; updateCamera(); }
    renderer.render(sceneThree, camera);
  }
  animate();
}

// ── Image attach / clear / persist ───────────────────────
const SITE_IMG_KEY = `archaiology_site_img_${siteId}`;

// ── Site GLB lookup ───────────────────────────────────────
// Add entries here as new models are pushed to 3d_models/
const SITE_GLBS = {
  'rio bec':                  '3d_models/Rio_Bec_Structure_5N2.min.glb',
  'ploutonion at hierapolis': '3d_models/Ploutonion_at_Hierapolis.min.glb',
};

// ── Mode helpers ──────────────────────────────────────────
function _hideAll() {
  document.getElementById('sceneImg').style.display   = 'none';
  document.getElementById('sceneModel').style.display = 'none';
  // canvas shown/hidden separately by initScene / animating flag
}

function applySceneModel(glbSrc, labelText, attrText) {
  const canvas = document.getElementById('sceneCanvas');
  const mv     = document.getElementById('sceneModel');
  _hideAll();
  canvas.style.display = 'none';
  if (renderer) animating = false;

  const doApply = () => {
    mv.src = glbSrc;
    mv.style.display = 'block';
  };
  if (customElements.get('model-viewer')) {
    doApply();
  } else {
    customElements.whenDefined('model-viewer').then(doApply);
  }

  document.getElementById('btnClearImg').style.display  = 'inline-block';
  document.getElementById('btnAttach').style.display    = 'none';
  document.getElementById('btnRotate').style.display    = 'none';
  document.getElementById('btnReset').style.display     = 'none';
  const lbl  = document.getElementById('sceneLabel');
  const attr = document.getElementById('sceneAttr');
  if (lbl  && labelText) lbl.textContent  = labelText;
  if (attr && attrText)  attr.textContent = attrText;
}

function applySceneImage(src, labelText, attrText) {
  const img    = document.getElementById('sceneImg');
  const canvas = document.getElementById('sceneCanvas');
  _hideAll();
  img.src = src;
  img.style.display = 'block';
  canvas.style.display = 'none';
  if (renderer) animating = false;
  document.getElementById('btnClearImg').style.display = 'inline-block';
  document.getElementById('btnAttach').style.display   = 'none';
  document.getElementById('btnRotate').style.display   = 'none';
  document.getElementById('btnReset').style.display    = 'none';
  const lbl  = document.getElementById('sceneLabel');
  const attr = document.getElementById('sceneAttr');
  if (lbl  && labelText) lbl.textContent  = labelText;
  if (attr && attrText)  attr.textContent = attrText;
}

// Auto-restore priority:
//   1. localStorage (user override — image attached manually)
//   2. Site GLB from SITE_GLBS lookup
//   3. Committed jpg asset (assets/site-images/{siteId}.jpg)
//   4. Procedural canvas (default — no action needed)
(function restoreViewer() {
  // 1. localStorage
  const stored = localStorage.getItem(SITE_IMG_KEY);
  if (stored) {
    try {
      const { src, label, attr } = JSON.parse(stored);
      applySceneImage(src, label, attr);
      return;
    } catch(e) {
      localStorage.removeItem(SITE_IMG_KEY);
    }
  }

  // 2. Site GLB
  const glbSrc = SITE_GLBS[siteId.toLowerCase().trim()];
  if (glbSrc) {
    applySceneModel(
      glbSrc,
      `${siteId} — 3D Model`,
      glbSrc.split('/').pop().replace('.min.glb', '').replace(/_/g, ' ')
    );
    return;
  }

  // 3. Committed image asset
  const assetSrc = `assets/site-images/${encodeURIComponent(siteId)}.jpg`;
  const probe = new Image();
  probe.onload = () => {
    applySceneImage(
      assetSrc,
      `${siteId} — Site Image`,
      `assets/site-images/${siteId}.jpg`
    );
    try {
      localStorage.setItem(SITE_IMG_KEY, JSON.stringify({
        src: assetSrc,
        label: `${siteId} — Site Image`,
        attr:  `assets/site-images/${siteId}.jpg`
      }));
    } catch(e) {}
  };
  probe.src = assetSrc;
  // 4. probe.onerror → canvas stays visible, nothing to do
})();

const imgInput = document.getElementById('imgUploadInput');
if (imgInput) {
  imgInput.addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const label = file.name.replace(/\.[^.]+$/, '');
      const attr  = 'User-attached image · ' + (file.size / 1024).toFixed(0) + ' KB';
      applySceneImage(e.target.result, label, attr);
      try {
        localStorage.setItem(SITE_IMG_KEY, JSON.stringify({
          src: e.target.result, label, attr
        }));
      } catch(err) {
        console.warn('[archaiology] localStorage quota exceeded; image shown but not persisted');
      }
    };
    reader.readAsDataURL(file);
  });
}

function clearSceneImage() {
  const img   = document.getElementById('sceneImg');
  const mv    = document.getElementById('sceneModel');
  const canvas = document.getElementById('sceneCanvas');
  const input = document.getElementById('imgUploadInput');
  img.src = ''; img.style.display = 'none';
  mv.src  = ''; mv.style.display  = 'none';

  // If this site has a GLB, restore the model rather than the canvas
  const glbSrc = SITE_GLBS[siteId.toLowerCase().trim()];
  if (glbSrc) {
    localStorage.removeItem(SITE_IMG_KEY);
    if (input) input.value = '';
    applySceneModel(
      glbSrc,
      `${siteId} — 3D Model`,
      glbSrc.split('/').pop().replace('.min.glb', '').replace(/_/g, ' ')
    );
    return;
  }

  canvas.style.display = 'block';
  if (renderer) animating = true;
  document.getElementById('btnClearImg').style.display = 'none';
  document.getElementById('btnAttach').style.display   = 'inline-block';
  document.getElementById('btnRotate').style.display   = 'inline-block';
  document.getElementById('btnReset').style.display    = 'inline-block';
  if (input) input.value = '';
  localStorage.removeItem(SITE_IMG_KEY);
  const site = window._currentSite;
  if (site) {
    const lbl  = document.getElementById('sceneLabel');
    const attr = document.getElementById('sceneAttr');
    if (lbl)  lbl.textContent  = hn(site.name) + ' — Procedural Reconstruction';
    if (attr) attr.textContent = 'Default model · Refines as corpus grows';
  }
}
// ── NATIVE LAND DIGITAL ───────────────────────────────────
// API: https://api-docs.native-land.ca
// CC0 licensed. Queries territories, languages, and treaties
// for the site's lat/lng coordinates.
// ── NATIVE LAND DIGITAL ───────────────────────────────────
// API: https://api-docs.native-land.ca  (CC0)
// Set your key from native-land.ca/auth/signup → API tab
const NATIVE_LAND_API_KEY = "YOUR_NATIVE_LAND_API_KEY";

async function loadNativeLand(lat, lng) {
  const card = document.getElementById("nativeLandCard");
  const body = document.getElementById("nativeLandBody");
  card.style.display = "block";

  // Normalise response — API returns a bare array of GeoJSON features
  function toFeatures(raw) {
    if (Array.isArray(raw)) return raw;
    if (raw && Array.isArray(raw.features)) return raw.features;
    return [];
  }

  // Properties use capital-case keys: Name, Slug
  const getName = f => f.properties?.Name || f.properties?.name || f.properties?.NAME || "";
  const getSlug = f => f.properties?.Slug || f.properties?.slug || f.properties?.SLUG || "";

  const dedup = arr => {
    const seen = new Set();
    return arr.filter(f => {
      const k = getSlug(f) || getName(f);
      if (!k || seen.has(k)) return false;
      seen.add(k); return true;
    });
  };

  try {
    const base = `https://native-land.ca/api/index.php?position=${lat},${lng}&key=${NATIVE_LAND_API_KEY}`;

    // Three parallel fetches — one per category so typing is unambiguous
    const [rT, rL, rTr] = await Promise.all([
      fetch(`${base}&maps=territories`),
      fetch(`${base}&maps=languages`),
      fetch(`${base}&maps=treaties`),
    ]);

    if (!rT.ok && !rL.ok && !rTr.ok) {
      throw new Error(`API error: ${rT.status} / ${rL.status} / ${rTr.status}`);
    }

    const [rawT, rawL, rawTr] = await Promise.all([
      rT.ok  ? rT.json()  : null,
      rL.ok  ? rL.json()  : null,
      rTr.ok ? rTr.json() : null,
    ]);

    // Debug — open DevTools console to see raw API output
    console.log("[NativeLand] territories:", rawT);
    console.log("[NativeLand] languages:",   rawL);
    console.log("[NativeLand] treaties:",    rawTr);

    const territories = dedup(toFeatures(rawT));
    const languages   = dedup(toFeatures(rawL));
    const treaties    = dedup(toFeatures(rawTr));

    if (!territories.length && !languages.length && !treaties.length) {
      body.innerHTML =
        `<p class="nl-none">No Indigenous territory data for these coordinates.</p>
         <a class="nl-map-link"
            href="https://native-land.ca/maps/?lat=${lat}&lng=${lng}"
            target="_blank" rel="noopener">
           View on Native Land map <span class="ext-link-arrow">↗</span>
         </a>
         <div class="nl-disclaimer">Data: <a href="https://native-land.ca" target="_blank"
           rel="noopener">Native Land Digital</a> (CC0). Not official or legal boundaries.</div>`;
      return;
    }

    const renderGroup = (label, items, cls) => {
      if (!items.length) return "";
      const pills = items.map(f => {
        const name = getName(f);
        const slug = getSlug(f);
        if (!name) return "";
        const href = slug
          ? `https://native-land.ca/maps/indigenous-territory/${encodeURIComponent(slug)}`
          : "https://native-land.ca/";
        return `<a class="nl-pill nl-pill-${cls}"
                   href="${href}" target="_blank" rel="noopener">${name}</a>`;
      }).filter(Boolean).join("");
      return pills
        ? `<div class="nl-group">
             <div class="nl-group-label">${label}</div>
             <div class="nl-pills">${pills}</div>
           </div>`
        : "";
    };

    body.innerHTML =
      renderGroup("Territories", territories, "territory") +
      renderGroup("Languages",   languages,   "language")  +
      renderGroup("Treaties",    treaties,    "treaty")    +
      `<a class="nl-map-link"
          href="https://native-land.ca/maps/?lat=${lat}&lng=${lng}"
          target="_blank" rel="noopener">
        View on Native Land map <span class="ext-link-arrow">↗</span>
      </a>
      <div class="nl-disclaimer">
        Data: <a href="https://native-land.ca" target="_blank" rel="noopener">Native Land Digital</a> (CC0).
        Not official or legal boundaries. Reflects Indigenous self-identification.
      </div>`;

  } catch (err) {
    console.error("[NativeLand] error:", err);

    // CORS / network failure → fall back to official iframe embed
    const isCORS = err.message === "Failed to fetch"
                || err.message?.includes("NetworkError")
                || err.name === "TypeError";
    if (isCORS) {
      body.innerHTML =
        `<iframe
           src="https://native-land.ca/api/embed/embed.html?maps=territories,languages&lat=${lat}&lng=${lng}"
           style="width:100%;height:220px;border:none;display:block;"
           title="Native Land territories" loading="lazy"></iframe>
         <div class="nl-disclaimer" style="margin-top:.5rem">
           Data: <a href="https://native-land.ca" target="_blank" rel="noopener">Native Land Digital</a> (CC0).
           Not official or legal boundaries.
         </div>`;
    } else {
      body.innerHTML =
        `<p class="nl-none">Could not load territory data.</p>
         <a class="nl-map-link" href="https://native-land.ca" target="_blank" rel="noopener">
           Native Land Digital ↗</a>`;
    }
  }
}
