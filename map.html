<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — The Bull Corridor · Bucranica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tc:        #B85C38;
      --tc-light:  #D4845E;
      --tc-pale:   #3A1A0A;
      --gold:      #C9A84C;
      --gold-dim:  #8A6E2C;
      --ink:       #0A0205;
      --ink2:      #110308;
      --parchment: #E8D5C0;
      --parch-dim: #A08060;

      /* tier colors */
      --tier-a:   #C9A84C;
      --tier-ab:  #B85C38;
      --tier-b:   #7A9E7E;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Spectral', Georgia, serif;
      background: var(--ink);
      color: var(--parchment);
      display: flex;
      flex-direction: column;
    }

    /* ── TOPBAR ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      border-bottom: 0.5px solid rgba(180,120,60,0.2);
      background: rgba(10,2,5,0.95);
      z-index: 1000;
    }

    .topbar-back {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(200,160,100,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }
    .topbar-back:hover { color: var(--gold); }
    .topbar-back::before { content: '← '; }

    .topbar-center {
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .topbar-brand {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .topbar-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: var(--parch-dim);
    }

    .topbar-count {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: rgba(180,120,60,0.4);
      text-transform: uppercase;
    }

    /* ── LAYOUT: sidebar + map ── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--ink2);
      border-right: 0.5px solid rgba(180,120,60,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 500;
    }

    .sidebar-filters {
      flex-shrink: 0;
      padding: 1rem;
      border-bottom: 0.5px solid rgba(180,120,60,0.12);
    }

    .filter-label {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(180,120,60,0.4);
      margin-bottom: 0.6rem;
      display: block;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 0.75rem;
    }

    .ftag {
      font-family: 'Spectral', serif;
      font-size: 10px;
      font-style: italic;
      color: var(--parch-dim);
      padding: 2px 8px;
      border: 0.5px solid rgba(180,120,60,0.2);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
    }

    .ftag:hover { border-color: rgba(180,120,60,0.5); color: var(--parchment); }
    .ftag.active { border-color: var(--tc); color: var(--parchment); background: rgba(184,92,56,0.15); }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(180,120,60,0.2);
      border-radius: 2px;
      padding: 7px 10px;
      font-family: 'Spectral', serif;
      font-size: 12px;
      font-style: italic;
      color: var(--parchment);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: rgba(200,160,100,0.25); }
    .search-input:focus { border-color: rgba(180,120,60,0.45); }

    /* site list */
    .site-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .site-list::-webkit-scrollbar { width: 3px; }
    .site-list::-webkit-scrollbar-track { background: transparent; }
    .site-list::-webkit-scrollbar-thumb { background: rgba(180,120,60,0.2); border-radius: 2px; }

    .site-item {
      padding: 0.75rem 1rem;
      border-bottom: 0.5px solid rgba(180,120,60,0.07);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .site-item:hover { background: rgba(184,92,56,0.07); }
    .site-item.active { background: rgba(184,92,56,0.14); border-left: 2px solid var(--tc); }

    .site-tier-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .site-info { flex: 1; min-width: 0; }

    .site-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--parchment);
      line-height: 1.2;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-region {
      font-family: 'Spectral', serif;
      font-size: 10px;
      font-style: italic;
      color: var(--parch-dim);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-period {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: rgba(180,120,60,0.45);
    }

    /* ── MAP ── */
    .map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Custom Leaflet tile override for dark mode */
    .leaflet-tile { filter: brightness(0.35) sepia(0.4) hue-rotate(10deg) saturate(0.6); }

    /* Corridor segment legend */
    .map-legend {
      position: absolute;
      bottom: 1.5rem;
      right: 1rem;
      z-index: 800;
      background: rgba(10,2,5,0.88);
      border: 0.5px solid rgba(180,120,60,0.2);
      border-radius: 3px;
      padding: 0.9rem 1rem;
      backdrop-filter: blur(6px);
      min-width: 180px;
    }

    .legend-title {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(180,120,60,0.5);
      margin-bottom: 0.65rem;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.tier-a  { background: var(--tier-a);  box-shadow: 0 0 5px rgba(201,168,76,0.6); }
    .legend-dot.tier-ab { background: var(--tier-ab); box-shadow: 0 0 5px rgba(184,92,56,0.6);  }
    .legend-dot.tier-b  { background: var(--tier-b);  box-shadow: 0 0 5px rgba(122,158,126,0.5);}

    .legend-text {
      font-family: 'Spectral', serif;
      font-size: 10px;
      font-style: italic;
      color: var(--parch-dim);
    }

    .legend-rule {
      height: 0.5px;
      background: rgba(180,120,60,0.15);
      margin: 7px 0;
    }

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper {
      background: rgba(10,2,5,0.95) !important;
      border: 0.5px solid rgba(180,120,60,0.3) !important;
      border-radius: 3px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important;
      color: var(--parchment) !important;
      backdrop-filter: blur(8px);
    }

    .leaflet-popup-tip { background: rgba(10,2,5,0.95) !important; }
    .leaflet-popup-close-button { color: rgba(180,120,60,0.5) !important; font-size: 18px !important; }
    .leaflet-popup-close-button:hover { color: var(--gold) !important; }

    .popup-inner { min-width: 220px; max-width: 280px; }

    .popup-kicker {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--tc-light);
      margin-bottom: 5px;
    }

    .popup-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.1;
      color: var(--parchment);
      margin-bottom: 4px;
    }

    .popup-region {
      font-family: 'Spectral', serif;
      font-size: 11px;
      font-style: italic;
      color: var(--parch-dim);
      margin-bottom: 8px;
    }

    .popup-rule {
      height: 0.5px;
      background: rgba(180,120,60,0.2);
      margin-bottom: 8px;
    }

    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .popup-key {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(180,120,60,0.45);
    }

    .popup-val {
      font-family: 'Spectral', serif;
      font-size: 11px;
      font-style: italic;
      color: var(--parchment);
      text-align: right;
      max-width: 160px;
    }

    .popup-evidence {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .ev-chip {
      font-family: 'Cinzel', serif;
      font-size: 7px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tc-light);
      background: rgba(184,92,56,0.12);
      border: 0.5px solid rgba(184,92,56,0.25);
      border-radius: 2px;
      padding: 1px 5px;
    }

    /* Leaflet attribution dim */
    .leaflet-control-attribution {
      background: rgba(10,2,5,0.7) !important;
      color: rgba(180,120,60,0.3) !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a { color: rgba(180,120,60,0.4) !important; }

    .leaflet-control-zoom a {
      background: rgba(10,2,5,0.9) !important;
      color: rgba(200,160,100,0.6) !important;
      border-color: rgba(180,120,60,0.2) !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(30,8,12,0.95) !important;
      color: var(--gold) !important;
    }
  </style>
</head>

    const TIER_GLOW  = { "A": "rgba(201,168,76,0.55)", "A/B": "rgba(184,92,56,0.55)", "B": "rgba(122,158,126,0.45)" };

    // ── MAP INIT ──
    const map = L.map('map', {
      center: [35.5, 28.5],
      zoom: 5,
      zoomControl: true,
      attributionControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    // ── STATE ──
    let activeSegment = 'all';
    let activeTier    = 'all';
    let searchTerm    = '';
    let activeMarkers = {};
    let activeSiteId  = null;

    // ── CUSTOM MARKER ──
    function makeIcon(site, highlighted) {
      const color = TIER_COLOR[site.tier] || '#7A9E7E';
      const glow  = TIER_GLOW[site.tier]  || 'rgba(122,158,126,0.4)';
      const size  = highlighted ? 14 : 10;
      const shape = site.sea_route ? 'rect' : 'circle';

      let svg;
      if (shape === 'rect') {
        const s = size - 2;
        svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size+8}" height="${size+8}" viewBox="0 0 ${size+8} ${size+8}">
          <rect x="4" y="4" width="${s}" height="${s}" rx="1"
            fill="${color}" fill-opacity="0.85"
            stroke="${color}" stroke-width="1"
            filter="url(#g)"/>
          <defs><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        </svg>`;
      } else {
        svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size+8}" height="${size+8}" viewBox="0 0 ${size+8} ${size+8}">
          <circle cx="${(size+8)/2}" cy="${(size+8)/2}" r="${size/2}"
            fill="${color}" fill-opacity="${highlighted ? 0.95 : 0.8}"
            stroke="${color}" stroke-width="${highlighted ? 1.5 : 0.5}"
            filter="url(#g)"/>
          <defs><filter id="g"><feGaussianBlur stdDeviation="${highlighted?3:2}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        </svg>`;
      }

      const encoded = 'data:image/svg+xml,' + encodeURIComponent(svg);
      return L.icon({
        iconUrl: encoded,
        iconSize: [size + 8, size + 8],
        iconAnchor: [(size + 8) / 2, (size + 8) / 2],
        popupAnchor: [0, -(size / 2 + 6)]
      });
    }

    // ── POPUP HTML ──
    function popupHtml(site) {
      const tierLabel = site.tier === 'A' ? 'Tier A — explicit texts'
                      : site.tier === 'A/B' ? 'Tier A/B — strong traces'
                      : 'Tier B — structural';
      const chips = site.evidence.map(e =>
        `<span class="ev-chip">${e}</span>`).join('');
      return `<div class="popup-inner">
        <p class="popup-kicker">${site.segment}</p>
        <h3 class="popup-title">${site.name}</h3>
        <p class="popup-region">${site.region}</p>
        <div class="popup-rule"></div>
        <div class="popup-row">
          <span class="popup-key">Period</span>
          <span class="popup-val">${site.period}</span>
        </div>
        <div class="popup-row">
          <span class="popup-key">Tier</span>
          <span class="popup-val">${tierLabel}</span>
        </div>
        <div class="popup-row">
          <span class="popup-key">Role</span>
          <span class="popup-val">${site.role}</span>
        </div>
        <div class="popup-row">
          <span class="popup-key">Confidence</span>
          <span class="popup-val">${site.confidence}</span>
        </div>
        <div class="popup-evidence">${chips}</div>
      </div>`;
    }

    // ── RENDER ──
    function filteredSites() {
      return SITES.filter(s => {
        const segOk = activeSegment === 'all' || s.segment === activeSegment;
        const tierOk = activeTier === 'all' || s.tier === activeTier;
        const q = searchTerm.toLowerCase();
        const textOk = !q ||
          s.name.toLowerCase().includes(q) ||
          s.region.toLowerCase().includes(q) ||
          s.segment.toLowerCase().includes(q) ||
          s.evidence.some(e => e.toLowerCase().includes(q));
        return segOk && tierOk && textOk;
      });
    }

    function renderAll() {
      const sites = filteredSites();

      // clear markers
      Object.values(activeMarkers).forEach(m => map.removeLayer(m));
      activeMarkers = {};

      // render markers
      sites.forEach(site => {
        const marker = L.marker([site.lat, site.lng], {
          icon: makeIcon(site, site.id === activeSiteId)
        }).addTo(map);

        marker.bindPopup(popupHtml(site), {
          maxWidth: 300,
          className: 'buc-popup'
        });

        marker.on('click', () => selectSite(site.id));
        activeMarkers[site.id] = marker;
      });

      // render list
      const list = document.getElementById('site-list');
      list.innerHTML = '';
      sites.forEach(site => {
        const el = document.createElement('div');
        el.className = 'site-item' + (site.id === activeSiteId ? ' active' : '');
        el.dataset.id = site.id;
        el.innerHTML = `
          <div class="site-tier-dot" style="background:${TIER_COLOR[site.tier]};box-shadow:0 0 4px ${TIER_GLOW[site.tier]}"></div>
          <div class="site-info">
            <p class="site-name">${site.name}${site.subname ? ' <span style="opacity:0.5;font-size:11px">· ' + site.subname + '</span>' : ''}</p>
            <p class="site-region">${site.region}</p>
            <p class="site-period">${site.period}</p>
          </div>`;
        el.addEventListener('click', () => selectSite(site.id));
        list.appendChild(el);
      });

      document.getElementById('site-count').textContent = sites.length + ' site' + (sites.length !== 1 ? 's' : '');
    }

    function selectSite(id) {
      activeSiteId = id;
      const site = SITES.find(s => s.id === id);
      if (!site) return;

      // update markers
      Object.entries(activeMarkers).forEach(([sid, m]) => {
        m.setIcon(makeIcon(SITES.find(s => s.id === sid), sid === id));
      });

      // open popup
      if (activeMarkers[id]) {
        map.setView([site.lat, site.lng], Math.max(map.getZoom(), 6), { animate: true });
        activeMarkers[id].openPopup();
      }

      // highlight list item
      document.querySelectorAll('.site-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });

      // scroll list item into view
      const el = document.querySelector(`.site-item[data-id="${id}"]`);
      if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    // ── FILTERS ──
    document.getElementById('segment-filters').addEventListener('click', e => {
      const btn = e.target.closest('.ftag');
      if (!btn) return;
      document.querySelectorAll('#segment-filters .ftag').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeSegment = btn.dataset.segment;
      activeSiteId = null;
      renderAll();
    });

    document.getElementById('tier-filters').addEventListener('click', e => {
      const btn = e.target.closest('.ftag');
      if (!btn) return;
      document.querySelectorAll('#tier-filters .ftag').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTier = btn.dataset.tier;
      activeSiteId = null;
      renderAll();
    });

    document.getElementById('search').addEventListener('input', e => {
      searchTerm = e.target.value;
      activeSiteId = null;
      renderAll();
    });

    // ── INITIAL RENDER ──
    renderAll();
  </script>
</body>
</html>
